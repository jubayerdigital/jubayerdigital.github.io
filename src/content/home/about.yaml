heading: "About me"
body: "I started in-house, running paid media for a brand that couldn't afford to waste a single dollar of ad spend — which is exactly the discipline I bring to every client now. Today I work with a deliberately small roster, because the strategy only holds up if I'm the one watching the numbers every week, not a junior account manager three layers removed from the account. If that's the kind of attention your marketing needs, we should talk."
